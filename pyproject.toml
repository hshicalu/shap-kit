[project]
name = "shap-kit"
version = "0.1.0"
description = "A small LightGBM and SHAP example using the Titanic dataset."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.0",
    "numba>=0.61.0,<0.62.0",
    "numpy>=2.2.0,<2.3.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.6.0",
    "shap>=0.47.0,<0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
